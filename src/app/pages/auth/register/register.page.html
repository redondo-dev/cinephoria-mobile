<ion-content class="register-content">
  <div class="register-container">
    <div class="header">
      <ion-button fill="clear" (click)="goToLogin()">
        <ion-icon name="arrow-back" color="light"></ion-icon>
      </ion-button>
      <h1 class="page-title">Inscription</h1>
    </div>

    <div class="register-form">
      <ion-item lines="none" class="input-item">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input
          type="text"
          placeholder="Nom *"
          [(ngModel)]="nom"
          required>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input
          type="text"
          placeholder="Prénom *"
          [(ngModel)]="prenom"
          required>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input
          type="email"
          placeholder="Email *"
          [(ngModel)]="email"
          required>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-icon name="call-outline" slot="start"></ion-icon>
        <ion-input
          type="tel"
          placeholder="Téléphone (optionnel)"
          [(ngModel)]="telephone">
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input
          type="password"
          placeholder="Mot de passe *"
          [(ngModel)]="password"
          required>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input
          type="password"
          placeholder="Confirmer le mot de passe *"
          [(ngModel)]="confirmPassword"
          required>
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        class="btn-netflix register-button"
        (click)="register()">
        Créer mon compte
      </ion-button>

      <div class="login-link">
        <p>Vous avez déjà un compte ?</p>
        <ion-button
          fill="clear"
          class="btn-outline-netflix"
          (click)="goToLogin()">
          Se connecter
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
